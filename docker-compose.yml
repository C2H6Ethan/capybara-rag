services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: capybaradb
      POSTGRES_USER: capybara
      POSTGRES_PASSWORD: capybara123
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U capybara -d capybaradb"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    image: ghcr.io/c2h6ethan/capybara-rag-backend:latest
    env_file: .env
    environment:
      DATABASE_URL: postgresql://capybara:capybara123@db:5432/capybaradb
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  frontend:
    image: ghcr.io/c2h6ethan/capybara-rag-frontend:latest
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  watchtower:
    image: containrrr/watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 300 --cleanup --label-enable
    restart: unless-stopped

volumes:
  pgdata:
